name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and package (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test core logic
        run: swift test --build-system native
      - name: Test AppKit controls
        run: bash scripts/check-ui.sh
      - name: Build package
        run: bash scripts/package-release.sh
      - name: Verify package
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: bash scripts/verify-package.sh
      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wink-macos-arm64
          path: |
            build/releases/Wink-*-macos-arm64.zip
            build/releases/Wink-*-macos-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wink-macos-arm64
          path: build/releases
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd build/releases
          sha256sum --check *.sha256
          cd ../..
          gh release create "$RELEASE_TAG" \
            build/releases/*.zip build/releases/*.sha256 \
            --verify-tag --title "Wink $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md"
